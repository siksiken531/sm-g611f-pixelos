name: TurboVNC-Telefon
run-name: siksiken-VNC — ${{ github.run_id }}
on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: siksiken Kurulum
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/tailscale.list >/dev/null
          sudo apt update && sudo apt install -y tailscale
          sudo tailscale up --authkey="$TS_KEY" --hostname=siksiken
          IP=$(tailscale ip -4)
          echo "IP=$IP" >> $GITHUB_ENV
        shell: bash

      - name: siksiken VNC
        run: |
          sudo apt update
          sudo apt install -y turbovnc-standalone-server xfce4 xfce4-terminal
          
          mkdir -p ~/.vnc
          echo -e "siksiken\nsiksiken\nn" | vncpasswd
          
          cat > ~/.vnc/xstartup << 'EOF'
#!/bin/bash
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS
exec startxfce4
EOF
          chmod +x ~/.vnc/xstartup
        shell: bash

      - name: siksiken Başlat
        run: |
          turbovncserver -geometry 1024x600 -depth 24 :1
          sleep 3
        shell: bash

      - name: siksiken
        run: |
          echo "========================================"
          echo "✅ siksiken"
          echo "========================================"
          echo "siksiken IP: ${{ env.IP }}"
          echo "siksiken PORT: 5901"
          echo "siksiken ŞİFRE: siksiken"
          echo "siksiken: ${{ env.IP }}:5901"
          echo ""
          echo "siksiken"
          echo "1. Tailscale ✅"
          echo "2. VNC → ${{ env.IP }}:5901"
          echo "3. siksiken"
          echo "4. siksiken"
          echo "========================================"
          echo "siksiken"
        shell: bash

      - name: siksiken Bekle
        run: sleep 21600
        shell: bash
        
