name: TurboVNC-Temiz
on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Kurulum
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y xfce4 xfce4-goodies xorg dbus-x11 x11-xserver-utils wget
          wget https://github.com/TurboVNC/turbovnc/releases/download/3.2/turbovnc_3.2_amd64.deb -O /tmp/t.deb
          sudo apt install -y /tmp/t.deb

      - name: Kullanıcı
        run: |
          sudo useradd -m siksiken || true
          echo "siksiken:siksiken" | sudo chpasswd

      - name: VNC Ayarları
        run: |
          sudo mkdir -p /home/siksiken/.vnc
          
          echo -n "siksiken" | sudo /opt/TurboVNC/bin/vncpasswd -f > /tmp/passwd
          sudo mv /tmp/passwd /home/siksiken/.vnc/passwd
          sudo chown siksiken:siksiken /home/siksiken/.vnc/passwd
          sudo chmod 600 /home/siksiken/.vnc/passwd
          
          echo '#!/bin/bash' > /tmp/start
          echo 'unset SESSION_MANAGER' >> /tmp/start
          echo 'unset DBUS_SESSION_BUS_ADDRESS' >> /tmp/start
          echo 'exec /usr/bin/startxfce4' >> /tmp/start
          
          sudo mv /tmp/start /home/siksiken/.vnc/xstartup
          sudo chmod +x /home/siksiken/.vnc/xstartup
          sudo chown siksiken:siksiken /home/siksiken/.vnc/xstartup

      - name: Başlat
        run: |
          sudo rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
          sudo -u siksiken /opt/TurboVNC/bin/vncserver -kill :1 || true
          sudo -u siksiken /opt/TurboVNC/bin/vncserver :1 -geometry 1280x720
          
          sleep 3
          echo "IP: $(tailscale ip -4):5901"
          echo "Şifre: siksiken"
          sleep 21600
          
