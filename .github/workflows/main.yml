name: TurboVNC-GNOME
on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: GNOME Kurulum
        run: |
          sudo apt update
          sudo apt upgrade -y
          
          # ✅ GNOME Masaüstü
          sudo apt install -y ubuntu-desktop-minimal
          
          # Gerekli Xorg & VNC paketleri
          sudo apt install -y xorg dbus-x11 x11-xserver-utils wget

      - name: TurboVNC Kur
        run: |
          wget https://github.com/TurboVNC/turbovnc/releases/download/3.2/turbovnc_3.2_amd64.deb -O /tmp/t.deb
          sudo apt install -y /tmp/t.deb

      - name: Kullanıcı
        run: |
          sudo useradd -m siksiken || true
          echo "siksiken:siksiken" | sudo chpasswd

      - name: VNC Ayarları
        run: |
          sudo rm -rf /home/siksiken/.vnc
          sudo -u siksiken mkdir -p /home/siksiken/.vnc
          
          # Şifre
          echo -n "siksiken" | sudo -u siksiken /opt/TurboVNC/bin/vncpasswd -f > /tmp/pw
          sudo mv /tmp/pw /home/siksiken/.vnc/passwd
          
          sudo chown -R siksiken:siksiken /home/siksiken/.vnc
          sudo chmod 700 /home/siksiken/.vnc
          sudo chmod 600 /home/siksiken/.vnc/passwd
          
          # ✅ GNOME Başlatma
          echo '#!/bin/bash' > /tmp/start
          echo 'unset SESSION_MANAGER' >> /tmp/start
          echo 'unset DBUS_SESSION_BUS_ADDRESS' >> /tmp/start
          echo 'export XDG_CURRENT_DESKTOP=GNOME' >> /tmp/start
          echo 'exec /usr/bin/gnome-session' >> /tmp/start
          
          sudo mv /tmp/start /home/siksiken/.vnc/xstartup
          sudo chmod +x /home/siksiken/.vnc/xstartup
          sudo chown siksiken:siksiken /home/siksiken/.vnc/xstartup

      - name: VNC'yi Başlat
        run: |
          rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
          sudo -u siksiken /opt/TurboVNC/bin/vncserver -kill :1 || true
          
          # GNOME için ekstra parametre
          sudo -u siksiken /opt/TurboVNC/bin/vncserver :1 -geometry 1280x720 -depth 24 -SecurityTypes None
          
          sleep 5
          echo "========================================"
          echo "✅ GNOME HAZIR!"
          echo "IP: $(tailscale ip -4):5901"
          echo "ŞİFRE: siksiken"
          echo "========================================"
          sleep 21600
          
