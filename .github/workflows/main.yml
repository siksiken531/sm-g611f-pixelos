name: Tailscale Windows RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Download and Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-unsigned.msi" -OutFile "tailscale-setup.msi"
          Start-Process msiexec.exe -ArgumentList '/i tailscale-setup.msi /quiet /norestart' -Wait
          Start-Sleep -Seconds 5

      - name: Start Tailscale and Get Login URL
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up
        
      - name: Get RDP and IP Info
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = & $tailscalePath ip -4
          Write-Host "=================================================="
          Write-Host "Tailscale IP adresiniz: $ip"
          Write-Host "Kullanıcı adı: runneradmin"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
