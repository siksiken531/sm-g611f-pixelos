name: Windows RDP via Tailscale Winget

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Tailscale'i Winget ile Kur
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements

      - name: Tailscale Giriş Bağlantısını Üret ve Bağlan
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up
          
      - name: Kullanıcı Adı ve Şifreyi Ayarla
        shell: powershell
        run: |
          net user siksiken siksiken /add
          net localgroup administrators siksiken /add
          net user runneradmin siksiken

      - name: RDP Servisini Etkinleştir
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
      - name: Tailscale IP Adresini Yazdır ve Oturumu Açık Tut
        shell: powershell
        run: |
          $tailscaleIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "Tailscale IP Adresin : $tailscaleIp" -ForegroundColor Yellow
          Write-Host "Kullanıcı Adı        : siksiken" -ForegroundColor Cyan
          Write-Host "Şifre                : siksiken" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          
          $timeout = [System.Diagnostics.Stopwatch]::StartNew()
          while ($timeout.Elapsed.TotalHours -lt 5.8) {
              Start-Sleep -Seconds 60
          }
