name: Windows TurboVNC Tailscale

on:
  workflow_dispatch:

jobs:
  windows-turbovnc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: TurboVNC Kurulumu
        run: |
          $url = "https://github.com/TurboVNC/turbovnc/releases/download/3.1.1/TurboVNC-3.1.1-x64.exe"
          $output = "$PSScriptRoot\turbovnc.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process -FilePath "$PSScriptRoot\turbovnc.exe" -ArgumentList "/verysilent /supressmsgboxes /norestart" -Wait
          Write-Host "TurboVNC basariyla kuruldu!"

      - name: Tailscale Kurulumu ve Ag Baglantisi (Winget)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Tailscale'i Winget ile kuruyoruz
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
          
          # Tailscale servisini baslatip hesaba baglaniyoruz
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up --authkey=$env:TAILSCALE_AUTHKEY --hostname=windows-turbovnc
          Write-Host "Tailscale baglantisi kuruldu!"

      - name: TurboVNC Sunucusunu Baslatma
        run: |
          $vncPath = "C:\Program Files\TurboVNC\vncserver.bat"
          if (!(Test-Path $vncPath)) {
              $vncPath = "C:\Program Files\TurboVNC\vncserver.exe"
          }
          Start-Process -FilePath $vncPath -ArgumentList "-geometry 1280x720 -depth 24"
          Write-Host "TurboVNC sunucusu baslatildi!"

      - name: Oturumu Açık Tutma
        run: |
          while ($true) {
              Start-Sleep -Seconds 30
          }
          
