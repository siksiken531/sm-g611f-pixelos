name: TurboVNC-Eglence
on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Tailscale Bağlan
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Sistemi Kur
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-terminal xauth wget

      - name: TurboVNC Kur
        run: |
          wget https://github.com/TurboVNC/turbovnc/releases/download/3.2/turbovnc_3.2_amd64.deb -O /tmp/t.deb
          sudo apt install -y /tmp/t.deb

      - name: Kullanıcı Ayarla
        run: |
          sudo useradd -m siksiken || true
          echo "siksiken:siksiken" | sudo chpasswd
          
          su - siksiken -c 'mkdir -p ~/.vnc && echo -n "siksiken" | /opt/TurboVNC/bin/vncpasswd -f > ~/.vnc/passwd && chmod 600 ~/.vnc/passwd'
          
          echo -e '#!/bin/bash\nexec startxfce4' > /tmp/xstartup
          chmod +x /tmp/xstartup
          su - siksiken -c 'cp /tmp/xstartup ~/.vnc/xstartup'

      - name: VNC'yi Başlat
        run: |
          su - siksiken -c '/opt/TurboVNC/bin/vncserver :1 -geometry 1280x720 -depth 24'
          sleep 2
          
          echo "========================================"
          echo "✅ BAĞLANTI HAZIR!"
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Bağlantı: $(tailscale ip -4):5901"
          echo "Şifre: siksiken"
          echo "========================================"
          
          su - siksiken -c '/opt/TurboVNC/bin/vncserver -list'
          sleep 3600
          
