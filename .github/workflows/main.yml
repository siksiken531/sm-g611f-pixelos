name: Tailscale Windows VNC

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install TightVNC and Tailscale
        shell: powershell
        run: |
          winget install --id TightVNC.TightVNC -e --accept-package-agreements --accept-source-agreements --silent
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements --silent
          Start-Sleep -Seconds 10

      - name: Configure and Start Interactive VNC Server
        shell: powershell
        run: |
          Stop-Service tvnserver -ErrorAction SilentlyContinue
          Set-Service tvnserver -StartupType Manual
          New-NetFirewallRule -DisplayName "VNC Server" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow
          
          # VNC şifre ayarı kayıt defteri yapılandırması
          $vncPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (!(Test-Path $vncPath)) { New-Item -Path $vncPath -Force }
          # 'siksiken' kelimesinin VNC formatındaki şifre hash karşılığı veya boş bırakma
          Set-ItemProperty -Path $vncPath -Name "UseControlAuthentication" -Value 0
          
          # VNC sunucusunu doğrudan kullanıcı oturumunda arka planda tetikle
          Start-Process "${env:ProgramFiles}\TightVNC\tvnserver.exe" -ArgumentList "-run"
          Start-Sleep -Seconds 5

      - name: Start Tailscale and Get Login URL
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up
        
      - name: Get Tailscale IP Info
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = & $tailscalePath ip -4
          Write-Host "=================================================="
          Write-Host "Tailscale IP adresiniz: $ip"
          Write-Host "VNC Portu: 5900"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
