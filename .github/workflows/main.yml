name: Windows TurboVNC

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Tailscale winget ile kur
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 10

      - name: Tailscale baglan
        shell: pwsh
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TS_AUTH_KEY }}" --hostname=gh-vnc --accept-routes
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: TurboVNC indir ve kur (tum parametreler)
        shell: pwsh
        run: |
          $url = "https://github.com/TurboVNC/turbovnc/releases/download/3.3.1/TurboVNC-3.3.1-x64.exe"
          Invoke-WebRequest $url -OutFile "$env:TEMP\turbovnc.exe"
          Write-Host "Indirildi. Parametreler deneniyor..."

          $params = @(
            @("/S"),
            @("/S", "/D=C:\TurboVNC"),
            @("/silent"),
            @("/quiet"),
            @("/S", "/NCRC"),
            @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"),
            @("/S", "/D=C:\TurboVNC", "/NCRC"),
            @("-s"),
            @("--silent")
          )

          foreach ($p in $params) {
            Write-Host "=== Deneniyor: $($p -join ' ') ==="
            $existing = Get-ChildItem "C:\" -Recurse -Filter "vncserver.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($existing) {
              Write-Host "Zaten kurulu: $($existing.FullName)"
              break
            }
            try {
              $proc = Start-Process "$env:TEMP\turbovnc.exe" -ArgumentList $p -PassThru -ErrorAction Stop
              $proc | Wait-Process -Timeout 90 -ErrorAction SilentlyContinue
            } catch {
              Write-Host "Hata: $_"
            }
            Start-Sleep -Seconds 5
            $found = Get-ChildItem "C:\" -Recurse -Filter "vncserver.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "BASARILI! Bulundu: $($found.FullName)"
              break
            } else {
              Write-Host "Bulunamadi, sonraki parametre..."
            }
          }

          Write-Host "--- Son durum ---"
          Get-ChildItem "C:\" -Recurse -Filter "vncserver.exe" -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
          Get-ChildItem "C:\" -Recurse -Filter "vncpasswd.exe" -ErrorAction SilentlyContinue | Select-Object -First 5 FullName

      - name: VNC sifresi ayarla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.vnc" | Out-Null
          $vncpasswd = Get-ChildItem "C:\" -Recurse -Filter "vncpasswd.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vncpasswd) { throw "vncpasswd.exe bulunamadi!" }
          Write-Host "Bulundu: $($vncpasswd.FullName)"
          "siksiken" | & $vncpasswd.FullName -f | Out-File "$env:USERPROFILE\.vnc\passwd" -Encoding ascii

      - name: TurboVNC baslat
        shell: pwsh
        run: |
          $vncserver = Get-ChildItem "C:\" -Recurse -Filter "vncserver.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vncserver) { throw "vncserver.exe bulunamadi!" }
          Write-Host "Bulundu: $($vncserver.FullName)"
          Start-Process $vncserver.FullName -ArgumentList "-geometry 1920x1080 -depth 24 -localhost no :1"
          Start-Sleep -Seconds 5

      - name: Tailscale IP yaz
        shell: pwsh
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Acik tut
        shell: pwsh
        run: while ($true) { Start-Sleep -Seconds 60 }
