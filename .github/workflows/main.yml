name: Tailscale Windows RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and Configure Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Administrator Credentials
        shell: powershell
        run: |
          secedit /export /cfg C:\config.inf
          (Get-Content C:\config.inf) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\config.inf
          (Get-Content C:\config.inf) -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\config.inf
          secedit /configure /db C:\s.sdb /cfg C:\config.inf /areas SECURITYPOLICY
          
          net user siksiken siksiken /add
          net localgroup administrators siksiken /add

      - name: Install Tailscale via WinGet
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements --silent
          Start-Sleep -Seconds 10

      - name: Start Tailscale and Get Login URL
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up
        
      - name: Get Tailscale IP Info
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = & $tailscalePath ip -4
          Write-Host "=================================================="
          Write-Host "Tailscale IP adresiniz: $ip"
          Write-Host "Kullanıcı adı: siksiken"
          Write-Host "Şifre: siksiken"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
