name: Windows TurboVNC Tailscale

on:
  workflow_dispatch:

jobs:
  windows-turbovnc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: TurboVNC Kurulumu
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/turbovnc/files/3.1.1/TurboVNC-3.1.1-x64.exe/download" -OutFile turbovnc.exe
          Start-Process -FilePath "turbovnc.exe" -ArgumentList "/verysilent /supressmsgboxes /norestart" -Wait
          Write-Host "TurboVNC basariyla kuruldu!"

      - name: Tailscale Kurulumu ve Ag Baglantisi
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-amd64.msi -OutFile tailscale-setup.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet /norestart'
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTHKEY --hostname=windows-turbovnc
          Write-Host "Tailscale baglantisi kuruldu!"

      - name: TurboVNC Sunucusunu Baslatma
        run: |
          $vncPath = "C:\Program Files\TurboVNC\vncserver.bat"
          if (!(Test-Path $vncPath)) {
              $vncPath = "C:\Program Files\TurboVNC\vncserver.exe"
          }
          # Windows uzerinde TurboVNC sunucusunu baslatiyoruz
          Start-Process -FilePath $vncPath -ArgumentList "-geometry 1280x720 -depth 24"
          Write-Host "TurboVNC sunucusu baslatildi!"

      - name: Oturumu Acik Tutma
        run: |
          while ($true) {
              Start-Sleep -Seconds 30
          }
          
