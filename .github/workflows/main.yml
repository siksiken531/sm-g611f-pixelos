name: Tailscale Windows RDP

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set Administrator Credentials
        shell: powershell
        run: |
          $passwd = "Siksiken123!_."
          net user runneradmin $passwd
          Write-Host "Kullanıcı adı: runneradmin"
          Write-Host "Şifre: Siksiken123!_."

      - name: Install Tailscale via winget
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 10

      - name: Start Tailscale and Get Login URL
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up
        
      - name: Get RDP and IP Info
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = & $tailscalePath ip -4
          Write-Host "=================================================="
          Write-Host "Tailscale IP adresiniz: $ip"
          Write-Host "Kullanıcı adı: runneradmin"
          Write-Host "Şifre: Siksiken123!_."
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
