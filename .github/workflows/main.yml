name: Linux TurboVNC

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Tailscale baglan
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Masaustu kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xfce4 xfce4-goodies xfce4-terminal \
            dbus-x11 x11-xserver-utils \
            wget curl ca-certificates

      - name: TurboVNC kur
        run: |
          wget -q https://github.com/TurboVNC/turbovnc/releases/download/3.1.1/turbovnc_3.1.1_amd64.deb -O /tmp/turbovnc.deb
          ls -la /tmp/turbovnc.deb
          sudo apt-get install -y -qq /tmp/turbovnc.deb
          echo "--- TurboVNC kurulum kontrolu ---"
          ls -la /opt/TurboVNC/bin/ || true

      - name: VNC sifresi ayarla
        run: |
          mkdir -p ~/.vnc
          echo "siksiken" | /opt/TurboVNC/bin/vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          ls -la ~/.vnc/

      - name: VNC xstartup yapilandir
        run: |
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

      - name: TurboVNC baslat
        run: |
          /opt/TurboVNC/bin/vncserver :1 -geometry 1920x1080 -depth 24 -rfbport 5901
          sleep 5
          echo "--- VNC process ---"
          ps aux | grep -i vnc | grep -v grep || true
          echo "--- Portlar ---"
          ss -tlnp | grep 590 || true
          echo "--- vncserver list ---"
          /opt/TurboVNC/bin/vncserver -list || true

      - name: Tailscale IP yaz
        run: |
          tailscale ip -4

      - name: Acik tut
        run: |
          echo "VNC hazir. Tailscale IP:5901 ile baglan."
          while true; do sleep 60; done
