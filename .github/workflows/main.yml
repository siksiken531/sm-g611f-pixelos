name: Windows TurboVNC + Tailscale + AVNC
on:
  workflow_dispatch:

jobs:
  windows-vnc:
    runs-on: windows-latest
    timeout-minutes: 360  # ⏱️ 6 saat

    steps:
      - name: TurboVNC Kur
        run: |
          winget install --id VirtualGL.TurboVNC -e --accept-source-agreements --accept-package-agreements
          Start-Sleep -Seconds 10
        shell: powershell

      - name: Tailscale Kur ve Bağla
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          choco install tailscale -y --no-progress
          Start-Process -FilePath "C:\Program Files\Tailscale\tailscale.exe" -ArgumentList "up --authkey=$env:TAILSCALE_AUTHKEY --hostname=gh-windows-vnc-$env:GITHUB_RUN_ID" -Wait
          Start-Sleep -Seconds 5
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
        shell: powershell

      - name: TurboVNC Yolunu Bul ve Başlat
        env:
          VNC_PASS: sifre123  # Kendi şifreni yap!
        run: |
          # ✅ Tüm olası yolları kontrol et
          $vncPaths = @(
            "C:\Program Files\TurboVNC\bin",
            "C:\Program Files\VirtualGL\TurboVNC\bin",
            "C:\Program Files\TurboVNC"
          )
          
          $binDir = $null
          foreach ($p in $vncPaths) {
            if (Test-Path "$p\vncserver.exe") {
              $binDir = $p
              break
            }
          }
          
          if (-not $binDir) {
            Write-Error "❌ TurboVNC bulunamadı! Yolları kontrol et."
            exit 1
          }
          
          Write-Host "✅ TurboVNC bulundu: $binDir"
          
          # Şifre dosyası klasörü
          $passDir = "$env:USERPROFILE\.vnc"
          $passFile = "$passDir\passwd"
          New-Item -ItemType Directory -Path $passDir -Force | Out-Null
          
          # ✅ vncpasswd tam yol ile çağır
          & "$binDir\vncpasswd.exe" $passFile <<EOF
$env:VNC_PASS
$env:VNC_PASS
EOF
          
          # ✅ VNC sunucuyu tam yol ile başlat
          & "$binDir\vncserver.exe" :0 -geometry 1280x720 -rfbport 5900 -rfbauth $passFile -interface 0.0.0.0
          
          Start-Sleep -Seconds 3
          Write-Host "✅ VNC Port 5900 hazır"
        shell: powershell

      - name: 📱 Bağlantı Bilgileri
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "✅ TAMAM — AVNC İLE BAĞLAN"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Port: 5900"
          Write-Host "Şifre: sifre123 (değiştirdiysen onu kullan)"
          Write-Host "Süre: 6 saat aktif kalacak"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "📌 AVNC'de yeni bağlantı:"
          Write-Host "Sunucu: $env:TAILSCALE_IP"
          Write-Host "Port: 5900"
          Write-Host "Şifre: sifre123"
        shell: powershell

      - name: ⏳ 6 Saat Beklet
        run: |
          Write-Host "VNC açık, 6 saat bekliyor..."
          Start-Sleep -Seconds 21600
        shell: powershell
        
