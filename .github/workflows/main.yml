name: TurboVNC Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manuel çalıştırma için

jobs:
  turbovnc:
    runs-on: windows-latest
    steps:
      - name: Sistem Bilgisi
        run: systeminfo
        shell: powershell

      - name: TurboVNC İndir & Kur
        run: |
          $installerUrl = "https://github.com/TurboVNC/turbovnc/releases/download/3.3.1/TurboVNC-3.3.1-x64.exe"
          $installerPath = "$env:TEMP\TurboVNC-3.3.1-x64.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
        shell: powershell

      - name: Kullanıcı Oluştur
        run: |
          $user = "siksiken"
          $pass = ConvertTo-SecureString "siksiken" -AsPlainText -Force
          New-LocalUser -Name $user -Password $pass -FullName "Eğlence Kullanıcısı" -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $user
        shell: powershell

      - name: VNC Şifresini Ayarla
        run: |
          $vncPass = "siksiken"
          $vncPath = "C:\Program Files\TurboVNC\bin"
          Set-Content -Path "$env:TEMP\vncpw.txt" -Value $vncPass
          & "$vncPath\vncpasswd.exe" -f "$env:TEMP\vncpw.txt"
        shell: powershell

      - name: TurboVNC Sunucuyu Başlat
        run: |
          $vncBin = "C:\Program Files\TurboVNC\bin"
          Start-Process -FilePath "$vncBin\vncserver.exe" -ArgumentList "-geometry 1280x720 -depth 24"
          Start-Sleep -Seconds 5
        shell: powershell

      - name: Bağlantı Bilgilerini Göster
        run: |
          Write-Host "================================"
          Write-Host "Kullanıcı adı: siksiken"
          Write-Host "Şifre: siksiken"
          Write-Host "VNC Port: 5901"
          Write-Host "================================"
          while ($true) { Start-Sleep 60 }  # Kapanmaması için
        shell: powershell
        
