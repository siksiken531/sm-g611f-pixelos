name: Windows TurboVNC + Tailscale + AVNC
on:
  workflow_dispatch:

jobs:
  windows-vnc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: TurboVNC Kur
        run: |
          winget install --id VirtualGL.TurboVNC -e --accept-source-agreements --accept-package-agreements
          Start-Sleep -Seconds 10
        shell: powershell

      - name: Tailscale Kur ve Hızlı Bağlan
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          choco install tailscale -y --no-progress
          
          # ✅ Arka planda çalıştır, beklemeyi engelle
          $proc = Start-Process -FilePath "C:\Program Files\Tailscale\tailscale.exe" -ArgumentList "up --authkey=$env:TAILSCALE_AUTHKEY --hostname=gh-win-vnc-$env:GITHUB_RUN_ID --timeout=30s" -PassThru
          
          # 15 saniye bekle, devam et
          Start-Sleep -Seconds 15
          
          # IP'yi al
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          if ($tsIP) {
            echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
            Write-Host "✅ Tailscale baglanti: $tsIP"
          } else {
            Write-Warning "⚠️ Tailscale IP alinamadi, direkt IP dene"
          }
        shell: powershell

      - name: TurboVNC Ayarla ve Başlat
        env:
          VNC_PASS: sifre123
        run: |
          $vncPaths = @(
            "C:\Program Files\TurboVNC\bin",
            "C:\Program Files\VirtualGL\TurboVNC\bin",
            "C:\Program Files\TurboVNC"
          )
          
          $binDir = $null
          foreach ($p in $vncPaths) {
            if (Test-Path "$p\vncserver.exe") {
              $binDir = $p
              break
            }
          }
          
          if (-not $binDir) {
            Write-Error "❌ TurboVNC bulunamadi"
            exit 1
          }
          
          Write-Host "✅ Bulundu: $binDir"
          
          $passDir = Join-Path $env:USERPROFILE ".vnc"
          $passFile = Join-Path $passDir "passwd"
          
          if (-not (Test-Path $passDir)) {
            New-Item -ItemType Directory -Path $passDir -Force | Out-Null
          }
          
          # Şifre oluştur
          $secPass = ConvertTo-SecureString $env:VNC_PASS -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential ("dummy", $secPass)
          $input = "$env:VNC_PASS`n$env:VNC_PASS`n"
          $input | & "$binDir\vncpasswd.exe" $passFile
          
          # VNC'yi başlat
          $vncExe = Join-Path $binDir "vncserver.exe"
          & $vncExe :0 -geometry 1280x720 -rfbport 5900 -rfbauth $passFile -interface 0.0.0.0
          
          Start-Sleep -Seconds 3
          Write-Host "✅ VNC hazir — Port 5900"
          
          # Gerekirse doğrudan IP'yi de yaz
          $directIP = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -notmatch 'Loopback' -and $_.PrefixOrigin -eq 'Dhcp' -or $_.PrefixOrigin -eq 'Manual' } | Select-Object -First 1).IPAddress
          Write-Host "💡 Alternatif IP: $directIP"
        shell: powershell

      - name: Bağlantı Bilgileri
        run: |
          Write-Host ""
          Write-Host "=================================="
          Write-Host "✅ AVNC BAGLANTI BILGILERI"
          if ($env:TAILSCALE_IP) {
            Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          }
          Write-Host "Port: 5900"
          Write-Host "Sifre: sifre123"
          Write-Host "Süre: 6 saat"
          Write-Host "=================================="
        shell: powershell

      - name: 6 Saat Beklet
        run: |
          Write-Host "Açik, 6 saat bekliyor..."
          Start-Sleep -Seconds 21600
        shell: powershell
        
