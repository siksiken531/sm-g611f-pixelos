name: Tailscale Windows VNC

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Software via WinGet Silent Install
        shell: powershell
        run: |
          winget install --id TightVNC.TightVNC -e --accept-package-agreements --accept-source-agreements --silent
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements --silent
          Start-Sleep -Seconds 10

      - name: Configure Windows Firewall and Start VNC
        shell: powershell
        run: |
          New-NetFirewallRule -DisplayName "VNC Server" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow -ErrorAction SilentlyContinue
          $vncPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (!(Test-Path $vncPath)) { New-Item -Path $vncPath -Force }
          Set-ItemProperty -Path $vncPath -Name "IpAccessControl" -Value "0.0.0.0/0" -ErrorAction SilentlyContinue
          
          # Servis mevcutsa başlat, değilse doğrudan yürütülebilir dosyayı tetikle
          $service = Get-Service -Name "tvnserver" -ErrorAction SilentlyContinue
          if ($service) {
              Start-Service tvnserver -ErrorAction SilentlyContinue
          } else {
              Start-Process "${env:ProgramFiles}\TightVNC\tvnserver.exe" -ArgumentList "-run" -ErrorAction SilentlyContinue
          }

      - name: Start Tailscale and Get Login URL
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up
        
      - name: Get Tailscale IP Info
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = & $tailscalePath ip -4
          Write-Host "=================================================="
          Write-Host "Tailscale IP adresiniz: $ip"
          Write-Host "VNC Portu: 5900"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
          
