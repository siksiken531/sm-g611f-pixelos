name: Windows TurboVNC

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Tailscale winget ile kur
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 10

      - name: Tailscale bağlan
        shell: pwsh
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_AUTHKEY }} --hostname=gh-vnc --accept-routes
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: TurboVNC winget ile kur
        shell: pwsh
        run: |
          winget install --id TurboVNC.TurboVNC -e --silent --accept-package-agreements --accept-source-agreements
          if (-not (Test-Path "C:\Program Files\TurboVNC\bin\vncserver.exe")) {
            Write-Host "winget olmadı, manuel indiriliyor..."
            Invoke-WebRequest "https://sourceforge.net/projects/turbovnc/files/3.1.1/turbovnc-3.1.1-x64.exe/download" -OutFile "$env:TEMP\turbovnc.exe"
            Start-Process "$env:TEMP\turbovnc.exe" -ArgumentList "/S" -Wait
          }

      - name: VNC şifresi ayarla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.vnc" | Out-Null
          "siksiken" | & "C:\Program Files\TurboVNC\bin\vncpasswd.exe" -f | Out-File "$env:USERPROFILE\.vnc\passwd" -Encoding ascii

      - name: TurboVNC başlat
        shell: pwsh
        run: |
          Start-Process "C:\Program Files\TurboVNC\bin\vncserver.exe" -ArgumentList "-geometry 1920x1080 -depth 24 -localhost no :1"
          Start-Sleep -Seconds 5

      - name: Tailscale IP yaz
        shell: pwsh
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Açık tut
        shell: pwsh
        run: while ($true) { Start-Sleep -Seconds 60 }
