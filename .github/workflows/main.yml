name: TurboVNC-SIFIR
on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 🧹 TÜMÜNÜ SİL
        run: |
          sudo apt remove -y --purge xfce4* xubuntu-* ubuntu-desktop* turbovnc* 2>/dev/null || true
          sudo apt autoremove -y
          sudo apt clean
          sudo rm -rf /home/siksiken /opt/TurboVNC /tmp/.X* /tmp/t.deb
          pkill -f Xvnc || true
          pkill -f vnc || true

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: ✅ SIFIRDAN Kurulum
        run: |
          sudo apt update
          sudo apt upgrade -y
          
          # Sadece XFCE — temiz ve tam
          sudo apt install -y xfce4 xfce4-goodies
          
          # Gerekli sistem paketleri
          sudo apt install -y xorg dbus-x11 x11-xserver-utils wget xauth

      - name: ✅ SIFIRDAN TurboVNC
        run: |
          wget https://github.com/TurboVNC/turbovnc/releases/download/3.2/turbovnc_3.2_amd64.deb -O /tmp/t.deb
          sudo apt install -y /tmp/t.deb

      - name: ✅ SIFIRDAN Kullanıcı
        run: |
          sudo useradd -m siksiken || true
          echo "siksiken:siksiken" | sudo chpasswd

      - name: ✅ SIFIRDAN VNC Ayarları
        run: |
          sudo -u siksiken mkdir -p /home/siksiken/.vnc
          
          echo -n "siksiken" | sudo -u siksiken /opt/TurboVNC/bin/vncpasswd -f > /tmp/pw
          sudo mv /tmp/pw /home/siksiken/.vnc/passwd
          
          sudo chown -R siksiken:siksiken /home/siksiken/.vnc
          sudo chmod 700 /home/siksiken/.vnc
          sudo chmod 600 /home/siksiken/.vnc/passwd
          
          echo '#!/bin/bash' > /tmp/start
          echo 'unset SESSION_MANAGER' >> /tmp/start
          echo 'unset DBUS_SESSION_BUS_ADDRESS' >> /tmp/start
          echo 'exec /usr/bin/startxfce4' >> /tmp/start
          
          sudo mv /tmp/start /home/siksiken/.vnc/xstartup
          sudo chmod +x /home/siksiken/.vnc/xstartup
          sudo chown siksiken:siksiken /home/siksiken/.vnc/xstartup

      - name: ✅ TEMİZ BAŞLAT
        run: |
          sudo -u siksiken /opt/TurboVNC/bin/vncserver -kill :* 2>/dev/null || true
          pkill -f Xvnc 2>/dev/null || true
          rm -rf /tmp/.X*-lock /tmp/.X11-unix/* /home/siksiken/.Xauthority
          
          sudo -u siksiken /opt/TurboVNC/bin/vncserver :1 -geometry 1280x720 -depth 24 -interface 0.0.0.0
          
          sleep 5
          
          echo "========================================"
          echo "✅ SIFIRDAN HAZIR!"
          echo "IP: $(tailscale ip -4):5901"
          echo "ŞİFRE: siksiken"
          echo "========================================"
          
          sleep 21600
          
