name: RDP Windows Simple

on:
  workflow_dispatch:

jobs:
  run-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Kullanıcı Şifresini Ayarla ve RDP'yi Etkinleştir
        shell: pwsh
        run: |
          net user runneradmin Password123!
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Tailscale Kurulumu ve Bağlantı
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
          Start-Sleep -Seconds 10
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes

      - name: Oturumu Açık Tutma
        shell: pwsh
        run: |
          Write-Host "Runner aktif."
          while ($true) {
              & "C:\Program Files\Tailscale\tailscale.exe" status | Out-Null
              Start-Sleep -Seconds 20
          }
          
