name: Ubuntu noVNC via Tailscale

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Runner bilgisi
        run: |
          echo "IP: $(curl -s ifconfig.me)"
          echo "Ülke: $(curl -s ipinfo.io/country)"
          echo "Şehir: $(curl -s ipinfo.io/city)"

      - name: Tailscale kur
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Tailscale servisini başlat
        run: |
          sudo tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5

      - name: Tailscale auth link ile bağlan
        run: |
          echo "=========================================="
          echo " ASAGIDAKI LINKI AC VE TAILSCALE HESABINLA GIR"
          echo "=========================================="
          sudo tailscale up --hostname=vnc-runner --accept-routes --accept-dns=false --timeout=10m 2>&1 | tee /tmp/ts.log || true
          echo "=========================================="

      - name: Bağlantı bekle ve IP göster
        run: |
          for i in $(seq 1 60); do
            IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$IP" ]; then break; fi
            sleep 5
          done
          if [ -z "$IP" ]; then echo "Tailscale baglanamadi! Linke tikladin mi?"; exit 1; fi
          echo "=========================================="
          echo " TAILSCALE IP: $IP"
          echo " noVNC PORT : 6080"
          echo " VNC SIFRE  : siksiken"
          echo "=========================================="

      - name: Masaüstü + noVNC + VNC kur
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies \
            tigervnc-standalone-server tigervnc-common \
            novnc websockify \
            dbus-x11 x11-xserver-utils

      - name: VNC şifresini ayarla
        run: |
          mkdir -p ~/.vnc
          echo "siksiken" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: VNC + noVNC başlat
        run: |
          # VNC server (display :1, port 5901)
          vncserver :1 -geometry 1600x900 -depth 24 -localhost no -SecurityTypes VncAuth

          # noVNC websockify (port 6080 -> 5901)
          websockify --web=/usr/share/novnc/ 6080 localhost:5901 > /tmp/novnc.log 2>&1 &

          sleep 5
          echo "noVNC çalışıyor: http://<tailscale-ip>:6080/vnc.html"

      - name: Canlı tut (6 saat)
        run: |
          echo "HAZIR!"
          echo "Tarayıcıdan: http://<TAILSCALE-IP>:6080/vnc.html"
          echo "Şifre: siksiken"
          sleep 21000
