name: TurboVNC Session

on:
  workflow_dispatch:

jobs:
  run-turbovnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: TurboVNC ve XFCE Kurulumu
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xfce4 xfce4-goodies curl wget xauth libglu1-mesa
          
          wget "https://github.com/TurboVNC/turbovnc/releases/download/3.1.1/turbovnc_3.1.1_amd64.deb" -O turbovnc.deb
          sudo apt-get install -y ./turbovnc.deb
          rm turbovnc.deb
          
          sudo useradd -m -s /bin/bash siksiken || true
          echo "siksiken:siksiken" | sudo chpasswd
          sudo usermod -aG sudo siksiken
          
          sudo mkdir -p /home/siksiken/.vnc
          echo "siksiken" | /opt/TurboVNC/bin/vncpasswd -f | sudo tee /home/siksiken/.vnc/passwd > /dev/null
          sudo chmod 600 /home/siksiken/.vnc/passwd
          sudo chown -R siksiken:siksiken /home/siksiken/.vnc
          
          echo "#!/bin/bash" | sudo tee /home/siksiken/.vnc/xstartup > /dev/null
          echo "xrdb $HOME/.Xresources" | sudo tee -a /home/siksiken/.vnc/xstartup > /dev/null
          echo "startxfce4 &" | sudo tee -a /home/siksiken/.vnc/xstartup > /dev/null
          sudo chmod +x /home/siksiken/.vnc/xstartup
          sudo chown siksiken:siksiken /home/siksiken/.vnc/xstartup

      - name: Tailscale Kurulumu ve TurboVNC Başlatma
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --accept-routes
          
          # Geçersiz -nolocalhost parametresi kaldırıldı
          sudo -u siksiken /opt/TurboVNC/bin/vncserver :1 -geometry 1280x720 -depth 24 -securitytypes VNC -rfbauth /home/siksiken/.vnc/passwd
          
          tsIp=$(tailscale ip -4)
          echo "=================================================="
          echo "TAILSCALE IP VE VNC PORTU: $tsIp:5901"
          echo "=================================================="

      - name: Oturumu Açık Tutma
        run: |
          while true; do
              tailscale status > /dev/null
              sleep 20
          done
