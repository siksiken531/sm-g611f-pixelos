name: TurboVNC Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  turbovnc:
    runs-on: windows-latest
    steps:
      - name: TurboVNC Kur
        run: |
          $url = "https://github.com/TurboVNC/turbovnc/releases/download/3.3.1/TurboVNC-3.3.1-x64.exe"
          $out = "$env:TEMP\vnc.exe"
          Invoke-WebRequest $url -OutFile $out
          Start-Process $out /VERYSILENT -Wait
        shell: powershell

      - name: Kullanıcı Oluştur
        run: |
          $user = "siksiken"
          # Windows kabul edecek format: 8+ karakter + harf+rakam
          $pass = ConvertTo-SecureString "siksiken123" -AsPlainText -Force
          New-LocalUser -Name $user -Password $pass -FullName "Eğlence" -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember Administrators $user
        shell: powershell

      - name: VNC Şifresi
        run: |
          $vncPath = "C:\Program Files\TurboVNC\bin"
          "siksiken123" | & "$vncPath\vncpasswd.exe" -f
        shell: powershell

      - name: VNC Başlat
        run: |
          Start-Process "C:\Program Files\TurboVNC\bin\vncserver.exe" -ArgumentList "-geometry 1280x720"
          Start-Sleep 5
        shell: powershell

      - name: Bilgiler
        run: |
          Write-Host "========================"
          Write-Host "Kullanıcı: siksiken"
          Write-Host "Şifre:     siksiken123"
          Write-Host "Port:      5901"
          Write-Host "========================"
          while ($true) { Start-Sleep 3600 }
        shell: powershell
        
