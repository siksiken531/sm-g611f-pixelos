name: Windows VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Tailscale kur (winget)
        shell: pwsh
        run: |
          winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
          # PATH güncellemesi için yeni shell'e gerek yok, direkt exe yolu:
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (!(Test-Path $ts)) { Write-Error "Tailscale kurulamadı!" }
          & $ts version

      - name: Tailscale servisini başlat
        shell: pwsh
        run: |
          Start-Service Tailscale
          Set-Service Tailscale -StartupType Automatic
          Start-Sleep -Seconds 5

      - name: Tailscale'e auth link ile bağlan
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          Write-Host "=========================================="
          Write-Host " ASAGIDAKI LINKI AC VE TAILSCALE HESABINLA GIR"
          Write-Host "=========================================="
          # --qr yerine normal auth URL basar, log'da görünür
          & $ts up --accept-routes --accept-dns=false --timeout=10m 2>&1 | Tee-Object -FilePath "$env:TEMP\ts.log"
          Get-Content "$env:TEMP\ts.log"
          Write-Host "=========================================="

      - name: Baglanti bekle ve IP'yi goster
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          for ($i=0; $i -lt 60; $i++) {
            $ip = & $ts ip -4 2>$null
            if ($ip) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $ip) { Write-Error "Tailscale baglanamadi! Link'e tikladin mi?" }
          Write-Host "=========================================="
          Write-Host " TAILSCALE IP: $ip"
          Write-Host " VNC PORT: 5900"
          Write-Host " KULLANICI: siksiken"
          Write-Host " SIFRE: siksiken"
          Write-Host "=========================================="

      - name: TightVNC kur ve baslat
        shell: pwsh
        run: |
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tightvnc.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\tightvnc.msi`" /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=siksiken SET_VIEWONLYPASSWORD=0 VALUE_OF_VIEWONLYPASSWORD=siksiken SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1" -Wait
          Start-Service tvnserver
          Set-Service tvnserver -StartupType Automatic
          New-NetFirewallRule -DisplayName "VNC" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow

      - name: Canli tut (6 saat)
        shell: pwsh
        run: |
          Write-Host "HAZIR! TightVNC Viewer ile baglan."
          Start-Sleep -Seconds 21000
