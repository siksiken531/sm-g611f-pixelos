name: Tailscale Windows VNC

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale and VNC via WinGet
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale -e --accept-package-agreements --accept-source-agreements --silent
          winget install --id TightVNC.TightVNC -e --accept-package-agreements --accept-source-agreements --silent
          Start-Sleep -Seconds 10

      - name: Configure Firewall and Start VNC
        shell: powershell
        run: |
          New-NetFirewallRule -DisplayName "VNC Server" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow -ErrorAction SilentlyContinue
          
          # Alternatif VNC yürütülebilir dosya yolunu bul ve çalıştır
          $vncPaths = @(
              "${env:ProgramFiles}\TightVNC\tvnserver.exe",
              "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe"
          )
          
          $foundPath = $vncPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          
          if ($foundPath) {
              Start-Process $foundPath -ArgumentList "-run" -ErrorAction SilentlyContinue
              Write-Host "VNC başlatıldı: $foundPath"
          } else {
              Write-Error "VNC yürütülebilir dosyası bulunamadı."
              exit 1
          }

      - name: Start Tailscale and Get Login URL
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tailscalePath up
        
      - name: Get Tailscale IP Info
        shell: powershell
        run: |
          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          $ip = & $tailscalePath ip -4
          Write-Host "=================================================="
          Write-Host "Tailscale IP adresiniz: $ip"
          Write-Host "VNC Portu: 5900"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
