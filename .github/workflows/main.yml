name: TurboVNC-Son-Cozum
on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}

      - name: Kurulum
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y xfce4 xfce4-goodies xorg dbus-x11 x11-xserver-utils wget
          wget https://github.com/TurboVNC/turbovnc/releases/download/3.2/turbovnc_3.2_amd64.deb -O /tmp/t.deb
          sudo apt install -y /tmp/t.deb

      - name: Kullanıcı Oluştur
        run: |
          sudo useradd -m siksiken || true
          echo "siksiken:siksiken" | sudo chpasswd

      - name: VNC Ayarları — DOĞRU İZİNLER
        run: |
          # Önce temizle
          sudo rm -rf /home/siksiken/.vnc
          
          # Klasörü KENDİSİ olarak oluştur
          sudo -u siksiken mkdir -p /home/siksiken/.vnc
          
          # Şifreyi oluştur
          echo -n "siksiken" | sudo -u siksiken /opt/TurboVNC/bin/vncpasswd -f | sudo tee /home/siksiken/.vnc/passwd > /dev/null
          
          # SAHİPLİĞİ KULLANICIYA VER — EN ÖNEMLİSİ!
          sudo chown -R siksiken:siksiken /home/siksiken/.vnc
          sudo chmod 700 /home/siksiken/.vnc
          sudo chmod 600 /home/siksiken/.vnc/passwd
          
          # xstartup dosyasını yaz
          sudo -u siksiken bash -c 'cat > /home/siksiken/.vnc/xstartup << INNER_EOF
#!/bin/bash
unset SESSION_MANAGER
unset DBUS_SESSION_BUS_ADDRESS
exec /usr/bin/startxfce4
INNER_EOF'
          
          sudo chmod +x /home/siksiken/.vnc/xstartup
          sudo chown siksiken:siksiken /home/siksiken/.vnc/xstartup
          
          # Kontrol et
          ls -la /home/siksiken/.vnc/

      - name: VNC'yi Başlat
        run: |
          # Eski kilitleri sil
          rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1
          
          # Önce öldür
          sudo -u siksiken /opt/TurboVNC/bin/vncserver -kill :1 || true
          
          # ŞİMDİ BAŞLAT
          sudo -u siksiken /opt/TurboVNC/bin/vncserver :1 -geometry 1280x720 -depth 24
          
          sleep 3
          
          echo "========================================"
          echo "✅ BAŞARILI!"
          echo "IP: $(tailscale ip -4):5901"
          echo "ŞİFRE: siksiken"
          echo "========================================"
          
          sleep 21600
          
