name: NoMachine Tailscale Windows

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  run-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Kullanıcı Şifresini Ayarla
        shell: pwsh
        run: |
          Write-Host "runneradmin şifresi 'Password123!' olarak ayarlanıyor..."
          net user runneradmin Password123!

      - name: NoMachine ve Tailscale Kurulumu (Winget ile)
        shell: pwsh
        run: |
          Write-Host "NoMachine Winget ile kuruluyor..."
          winget install --id NoMachine.NoMachine -e --accept-source-agreements --accept-package-agreements

          Write-Host "Tailscale Winget ile kuruluyor..."
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements

      - name: Tailscale Bağlantısı ve IP Alma
        shell: pwsh
        run: |
          Write-Host "Tailscale servisinin başlaması bekleniyor..."
          Start-Sleep -Seconds 10

          Write-Host "Tailscale ağına bağlanılıyor..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ github.event.inputs.tailscale_authkey }} --hostname=github-windows-runner

          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "TAILSCALE IP ADRESİNİZ: $tsIp" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: Oturumu Açık Tutma
        shell: pwsh
        run: |
          Write-Host "Runner aktif. NoMachine ile Tailscale IP adresine (Port: 4000) bağlanabilirsiniz."
          while ($true) {
              Start-Sleep -Seconds 30
          }
          
