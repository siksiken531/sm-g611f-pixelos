name: Build SM-G611F PixelOS (64-bit / Binder32)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 libssl-dev

      - name: Clone Toolchain & Helios Kernel
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain/aarch64
          git clone --recursive https://github.com/ananjaser1211/Helios_7870.git kernel/samsung/exynos7870

      - name: Fetch WireGuard Source
        run: |
          cd kernel/samsung/exynos7870
          if [ -f net/wireguard/wireguard-fetch.sh ]; then
            bash net/wireguard/wireguard-fetch.sh || true
          fi
          # WireGuard Kconfig eksikse oluştur
          mkdir -p net/wireguard
          touch net/wireguard/Kconfig net/wireguard/Makefile

      - name: Build Kernel for SM-G611F (on7xreflte)
        run: |
          TOOLCHAIN_PATH=$(pwd)/toolchain/aarch64/bin/aarch64-linux-android-
          
          cd kernel/samsung/exynos7870
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$TOOLCHAIN_PATH
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          export KCFLAGS="-DSDCARDFS_SUPER_MAGIC=0x5d42"
          export ANDROID_MAJOR_VERSION=o
          
          make exynos7870-on7xreflte_defconfig || make exynos7870-j7y17lte_defconfig
          
          make -j$(nproc --all) HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon" KCFLAGS="-DSDCARDFS_SUPER_MAGIC=0x5d42"

      - name: Verify Output Image
        run: |
          echo "Derlenen Kernel Image kontrol ediliyor:"
          ls -la kernel/samsung/exynos7870/arch/arm64/boot/Image*
