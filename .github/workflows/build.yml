name: NoMachine Tailscale Windows

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  run-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: NoMachine İndir ve Kur
        shell: pwsh
        run: |
          Write-Host "NoMachine Uptodown üzerinden indiriliyor..."
          $nomachineUrl = "https://dw.uptodown.com/dwn/download.php?file=258c70d49f6fc1ef3c5929668d29b1f50682057d2a5538e1b65ca4d134839cf9&code=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NDI2OTQ5OTcsInR5cCI6MiwidGNsIjoxLCJjb2QiOiJlbiIsImV4cCI6MTc4NDAzMzM3Mn0.KkH0LgqM94Y8Key0N4e8-N7_0Wb1lZ5xY2a4Q6m7E8c"
          $fallbackUrl = "https://download.nomachine.com/download/8.11/Windows/nomachine_8.11.3_1.exe"
          
          try {
              Invoke-WebRequest -Uri $fallbackUrl -OutFile "nomachine.exe"
          } catch {
              Write-Host "Alternatif link deneniyor..."
              Invoke-WebRequest -Uri $nomachineUrl -OutFile "nomachine.exe"
          }

          Write-Host "NoMachine kuruluyor..."
          Start-Process -FilePath "nomachine.exe" -ArgumentList "/verysilent /norestart" -Wait

      - name: Tailscale Kurulumu ve Bağlantı
        shell: pwsh
        run: |
          Write-Host "Tailscale indiriliyor..."
          $tailscaleUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $tailscaleUrl -OutFile "tailscale-setup.exe"

          Write-Host "Tailscale kuruluyor..."
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/verysilent /norestart" -Wait
          Start-Sleep -Seconds 5

          Write-Host "Tailscale ağına bağlanılıyor..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ github.event.inputs.tailscale_authkey }} --hostname=github-windows-runner

          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "TAILSCALE IP ADRESİNİZ: $tsIp" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: Oturumu Açık Tutma
        shell: pwsh
        run: |
          Write-Host "Runner aktif. NoMachine ile Tailscale IP adresine (Port: 4000) bağlanabilirsiniz."
          while ($true) {
              Start-Sleep -Seconds 59
          }
          
