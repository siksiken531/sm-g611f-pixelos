name: Build SM-G611F PixelOS (64-bit / Binder32)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 libssl-dev crossbuild-essential-arm64

      - name: Clone Helios Kernel Source
        run: |
          git clone --depth=1 https://github.com/ananjaser1211/Helios_7870.git kernel/samsung/exynos7870

      - name: Verify Kernel Source
        run: |
          echo "Kernel kaynak kodları başarıyla indirildi:"
          ls -la kernel/samsung/exynos7870
