name: NoMachine Tailscale Windows

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  run-windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: NoMachine Dosyasını Google Drive'dan İndir ve Kur
        shell: pwsh
        run: |
          Write-Host "Google Drive'daki NoMachine dosyası indiriliyor..."
          # Dosyanın ID'si: 1pwVYq0loU_qHZA4xJC6KmHEnUNiagmlO
          $fileId = "1pwVYq0loU_qHZA4xJC6KmHEnUNiagmlO"
          $url = "https://drive.google.com/uc?export=download&id=$fileId"
          
          # Büyük dosyalarda Google Drive uyarı sayfasını atlamak için cookie/session yönetimi
          $uri = "https://drive.google.com/uc?export=download&id=$fileId"
          $output = "nomachine.exe"
          
          # Invoke-WebRequest ile doğrudan indirme
          $response = Invoke-WebRequest -Uri $uri -SessionVariable sv
          if ($response.Content -match 'action="([^"]+)"') {
              $formAction = $matches[1]
              $response = Invoke-WebRequest -Uri $formAction -WebSession $sv -OutFile $output
          } else {
              $response = Invoke-WebRequest -Uri $uri -OutFile $output
          }

          Write-Host "NoMachine kuruluyor..."
          Start-Process -FilePath "nomachine.exe" -ArgumentList "/verysilent /norestart" -Wait

      - name: Tailscale Kurulumu ve Bağlantı
        shell: pwsh
        run: |
          Write-Host "Tailscale indiriliyor..."
          $tailscaleUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          Invoke-WebRequest -Uri $tailscaleUrl -OutFile "tailscale-setup.exe"

          Write-Host "Tailscale kuruluyor..."
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/verysilent /norestart" -Wait
          Start-Sleep -Seconds 5

          Write-Host "Tailscale ağına bağlanılıyor..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ github.event.inputs.tailscale_authkey }} --hostname=github-windows-runner

          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "TAILSCALE IP ADRESİNİZ: $tsIp" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: Oturumu Açık Tutma
        shell: pwsh
        run: |
          Write-Host "Runner aktif. NoMachine ile Tailscale IP adresine (Port: 4000) bağlanabilirsiniz."
          while ($true) {
              Start-Sleep -Seconds 30
          }
          
